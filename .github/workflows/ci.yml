name: ci

# Format, clippy, docs, and unit/integration tests for the workspace.
#
# Only affirmatively public events use hosted runners. The shared baseline
# inspects Git objects without executing caller code.
#
# `ci-ok` is the one required check; it runs no repository code.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: SylphxAI/.github/.github/workflows/changes.yml@6e0fab5388f5ae44afdd17abb2ec6c9b26f80b0e
    with:
      runner: ubuntu-latest

  shared-baseline:
    needs: changes
    if: github.event.repository.visibility == 'public' || needs.changes.outputs.migrations != 'false'
    uses: SylphxAI/.github/.github/workflows/shared-baseline-check.yml@6e0fab5388f5ae44afdd17abb2ec6c9b26f80b0e
    with:
      migrations: ${{ needs.changes.outputs.migrations }}

  lint:
    if: >-
      github.event.repository.visibility == 'public' ||
      ((github.event.repository.visibility == 'private' || github.event.repository.visibility == 'internal') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify approved references and tracked text
        if: github.event.repository.visibility == 'public'
        run: python3 scripts/check-oss-purity.py
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked
          cargo doc --workspace --no-deps --all-features --locked

  test:
    if: >-
      github.event.repository.visibility == 'public' ||
      ((github.event.repository.visibility == 'private' || github.event.repository.visibility == 'internal') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
        env:
          POSTGRES_DB: memory_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d memory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test workspace (all features, with live PostgreSQL)
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          AGENT_MEMORY_TEST_POSTGRES_URL: postgres://127.0.0.1/memory_test
        run: |
          cargo test --workspace --all-features --locked
          cargo test -p agent-memory --all-features --locked --test immutable_append postgres_immutable_append -- --ignored --exact
      - name: Run doctests (default features)
        run: cargo test --doc --workspace --locked
      - name: Check default features and individual memory backends
        run: |
          cargo check --workspace --locked
          cargo check -p agent-memory --no-default-features --locked
          cargo check -p agent-memory --no-default-features --features postgres --locked

  ci-ok:
    if: always() && !cancelled()
    needs: [changes, lint, test, shared-baseline]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs['test'].result }}
          BASELINE: ${{ needs.shared-baseline.result }}
          BASELINE_REQUIRED: ${{ github.event.repository.visibility == 'public' || needs.changes.outputs.migrations != 'false' }}
        run: |
          echo "results: changes=$CHANGES lint=$LINT test=$TEST baseline=$BASELINE (required=$BASELINE_REQUIRED)"
          if [ "$CHANGES" != success ] || [ "$LINT" != success ] || [ "$TEST" != success ]; then
            echo "a required job did not succeed"; exit 1
          fi
          if [ "$BASELINE" != success ] && { [ "$BASELINE" != skipped ] || [ "$BASELINE_REQUIRED" != false ]; }; then
            echo "the shared baseline did not succeed"; exit 1
          fi
